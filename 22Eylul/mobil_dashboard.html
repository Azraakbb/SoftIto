<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobil Dashboard</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            padding: 0;
            margin: 0;
        }

        :root{
            --primary:#4338ca;
            --primary-dark:#312e81;
            --accent:#5db095;
            --surface:#cb9bc7;
            --surface-light:#f3d4f3;
            --text:#f8fafc;
            --text-muted:#1e052f;
            --bg:#7586d3;
        }

        body{
            font-family: Verdana, Geneva, Thoma;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 16px;
        }

        .phone-container{
            width: 100%;
            max-width: 420px;
            background: var(--surface);
            border-radius: 28px;
            overflow: hidden;
            border: 1px solid var(--surface-light);
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .top-bar{
            position: sticky;
            top: 0;
            z-index:50 ;
            background: rgb(30,41,59,0.9) ;
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 20px;
            border-bottom: 1px solid var(--surface-light);
        }
        .avatar{
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background:  var(--primary);
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
        }
        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .balance-card{
            margin: 20px;
            padding: 24px;
            background: linear-gradient(135deg,var(--primary),var(--primary-dark));
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 10px 25px rgba(67,56,202,0.35);
        }

        .card-chip-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.15);
            padding: 4pc 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .balance-num{
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .quick-actions{
            display: flex;
            justify-content: space-around;
            padding: 0 20px 20px;
            gap:8px;
        }

        .action-btn{
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            background: transparent;
            border: none;
            color: var(--text);
            cursor:pointer;
            font-size: 12px;
        }

        .icon-circle{
            width: 52px;
            height: 52px;
            border-radius: 16px;
            background: var(--surface-light);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20;
            transition: all 0.2 ease;
        }

        .action-btn:hover .icon-circle {
            background: var(--primary);
            transform: translate(-3px);
        }

        .tx-section{ 
            padding:0 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .section-title{
            font-size: 16px;
            font-weight: 700;
            color:var(--text-muted)
        }

        .tx-item{
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            background: rgba(67,56,202,0.35);
            border-radius: 14px;
        }

        .tx-left{
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .tx-icon{
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: rgba(16,185,129,0.15);
            color:var(--accent);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
        }

        .tx-date{
            font-size: 12px;
            color: var(--text-muted);
        }

        .tx-amount{
            font-weight: 700;
            font-size: 15px;
            color: var(--accent);
        }

        .tx-amount.negative{
            color: rgb(73, 18, 18);
        }

    </style>
</head>
<body>
    <div class="phone-container">
        <header class="top-bar">
            
            <!--sticky üst bar-->
            <div class="top-bar">
                <div class="user-profile">
                <div class="avatar">AA</div>
                    <p style="font-size: 11px;color: var(--text-muted);">Hoşgeldim</p>
                    <strong>AZRA Nur AKBABA</strong>
                </div>
            </div>
            <button style="background: none;border: none;font-size: 20px;cursor: pointer;">🔔</button>
        </header>

    <!--Bakiye Kartı-->
        <section class="balance-card">
            <span class="card-chip-badge">PLATINUM</span>
            <p style="font-size: 13px;opacity: 0.85;">Toplam Varlıkları</p>
            <div class="balance-num">142.850.00 ₺</div>
            <p style="font-size: 12px;opacity: 0.7;">IBAN: TR45 0006 1005 **** 9210</p>
        </section>  

        <section class="quick-actions">
            <button class="action-btn">
                <div class="icon-circle">💳</div>
                <span>Ödemeler</span>
            </button>

            <button class="action-btn">
                <div class="icon-circle">↗️</div>
                <span>Transfer</span>
            </button>

            <button class="action-btn">
                <div class="icon-circle">📈</div>
                <span>Yatırım</span>
            </button>

            <button class="action-btn">
                <div class="icon-circle">QR</div>
                <span>Kredi Kartı</span>
            </button>
        </section>

        <section class="tx-section">
            <h4 class="section-title">Son Hesap Hareketleri</h4>

            <div class="tx-item">   
                <div class="tx-left">
                    <div class="tx-icon">💰</div>
                    <div>   
                        <div class="tx-title">Eğitim Hakedişi</div>
                        <div class="tx-date">Bugün,13.30-Havale</div>
                    </div>
                </div>
                <div class="tx-amount">+ 1.500,00 ₺</div>
            </div> 

            <div class="tx-item">
                <div class="tx-left">
                    <div class="tx-icon" style="background: rgb(124, 20, 20); color:rgb(202, 170, 233)">💰</div>
                    <div>   
                        <div class="tx-title">Kredi Kapatma</div>
                        <div class="tx-date">Bugün,13.30-Havale</div>
                    </div>
                </div>
                <div class="tx-amount negative">- 500,00 ₺</div>
            </div>

            <div class="tx-item">
                <div class="tx-left">
                    <div class="tx-icon" style="background: rgb(98, 15, 4); color:rgb(182, 175, 189)">💰</div>
                    <div>   
                        <div class="tx-title">Kahve Aldık</div>
                        <div class="tx-date">Bugün,13.30-Havale</div>
                    </div>
                </div>
                <div class="tx-amount negative">- 150,00 ₺</div>
            </div>   
        </section>
    </div>

</body>
</html>
