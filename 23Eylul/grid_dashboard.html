<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ev CSMS Portal</title>
    <style>
        *,*::before,*::after{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Courier New', Courier, monospace;
            background: #09090b;
            color: #f4f4f5;
        }
        .portal-shell{
            display: grid;
            grid-template-columns: 240px 1fr;
            grid-template-rows: 60px 1fr 40px;
            grid-template-areas: 
            "nav header" 
            "nav main"
            "nav footer";
            height: 100vh;
            gap: 12px;
            padding: 12px;
        }
        .panel{
            background: #1414;
            border: 1px solid #27272a;
            border-radius: 12px;
            padding: 16px 20px;
        }
        header{
            grid-area: header;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #18181b;
        }

        nav{
            display: flex;
            grid-area: nav;
            flex-direction: column;
            gap:10px;
            background: #121214;
        }

        main{
            grid-area: main;
            background: #141416;
            overflow-y: auto;
        }
        footer{
            grid-area: footer;
            display: flex;
            color:#71717a;
            justify-content: center;
            align-items: center;
            font-size: 12px;
        }
        .menu-item{
            padding: 10px 12px;
            border-radius: 8px;
            background: transparent;
            cursor: pointer;
            color: #a1a1aa;
            transition: all 0.15s ease;

        }

        .menu-item:hover{
            background: #9797ee;
            color:#f4f4f5;
        }
        .menu-item.active{
            background: #769f7f;
            font-weight: 600;
            color: #f4efef;
            border:1px solid #7f7f97;
        }

        .header-session {
            font-size: 13px;
            color: #a1a100;
        }
        .nav-title {
            font-size: 11px;
            font-weight: 700;
            color: #71717a;
            letter-spacing: 0.8px;
        }
        .main-title {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .main-desc {
            color: rgb(104, 104, 57);
            margin-top: 8px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="portal-shell">
        <header class="panel">
            <strong>SoftIto Panel</strong>
            <span class="header-session">Oturum: Azra Nur Akbaba</span>
        <nav class="panel">
            <div class="nav-title">Navigasyon</div>
            <div class="menu-item active">Dashboard</div>
            <div class="menu-item">İstasyonlar ve Soketler</div>
            <div class="menu-item">EPDK Bildirimleri</div>
            <div class="menu-item">Fatura ve Gelirler</div>
        </nav>

        <main class="panel">
            <h2 class="main-title">İki Boyutlu Alan Yönetimi</h2>
            <p class="main-desc">grid-template-areas sayesinde html sırasında bağımsız çalışır</p>
        </main>
        <footer class="panel">
            SoftIto 4.Dönem Eğitim
        </footer>
    </div>

</body>

</html>
