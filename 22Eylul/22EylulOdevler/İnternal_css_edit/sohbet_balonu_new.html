<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Sohbet Mesajı Mobil</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            padding: 0;
            margin: 0;
        }
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f3f4f6;
            padding: 20px;
            
        }
        .chat-row {
            display: flex;
            gap: 12px;
            align-items: flex-end;
            margin-bottom: 16px;
        }
        .avatar {
            flex-shrink: 0;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #ba6ab2;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .avatar.blue {
            background: #60a7c3;
        }
        .message-content {
            background: #60a7c3;
            color: #efe8e8;
            padding: 12px 16px;
            border-radius: 12px 12px 12px 12px;
            max-width: 75%;
            box-shadow: 0 1px 2px rgba(131, 70, 148, 0.1);
        }
        .chat-row.outgoing {
            flex-direction: row-reverse;
        }
        .chat-row.outgoing .message-content {
            background: #a76cb8;
            color: #fff;
            border-radius: 10px 10px 10px 12px;
        }


    </style>

</head>
<body>
    <div class="chat-row">
        <div class="avatar">AA</div>
        <div class="message-content">
            <strong>AZRA AKBABA</strong>
            <p>Hello! Flexbox mantığını anladın mı</p>
        </div>
    </div>
    <div class="chat-row outgoing">
        <div class="avatar blue">SM</div>
        <div class="message-content">
            <strong>YUSUF</strong>
            <p>ANLADIMMM</p>
        </div>
        
    </div>
</body>
</html>
